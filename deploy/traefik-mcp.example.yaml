# Example only. DNS/TLS and the namespace follow your existing Traefik setup.
# Enable mcp.enabled in the gateway before using this route. Preserve Host and path; each hostname must match the associated application domain.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: xuandu-mcp
  namespace: xuandu-gateway
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`product.example.com`) && Path(`/product/mcp`)
      kind: Rule
      services:
        - name: xuandu-mcp
          port: 8081
          passHostHeader: true
    - match: Host(`appb.example.com`) && Path(`/test/mcp`)
      kind: Rule
      services:
        - name: xuandu-mcp
          port: 8081
          passHostHeader: true
  tls: {}
